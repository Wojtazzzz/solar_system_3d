<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Interactive 3D solar system orrery. Drag planets to throw them, take a guided tour, play a quiz, and explore planetary facts. Built with Three.js. Installable as a PWA."
    />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Solar System 3D — interactive planetary exploration</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-system">
        <div class="loader-orbit loader-orbit--outer">
          <div class="loader-planet loader-planet--outer"></div>
        </div>
        <div class="loader-orbit loader-orbit--inner">
          <div class="loader-planet loader-planet--inner"></div>
        </div>
        <div class="loader-sun"></div>
      </div>
      <p class="loader-text">
        Loading solar system <span class="loader-percent" id="loaderPercent">0%</span>
      </p>
    </div>

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span class="sidebar-toggle__icon" aria-hidden="true"></span>
    </button>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation and settings">
      <header class="sidebar__header">
        <h1 class="sidebar__title">Solar System 3D</h1>
        <p class="sidebar__description">
          Interactive 3D orrery. Drag planets to throw them, take a guided tour,
          try the quiz, or explore real planetary facts. Built with Three.js.
        </p>
      </header>

      <details class="config-panel">
        <summary>Settings</summary>
        <div class="config-controls">
          <label class="config-row">
            <span>planets shadow</span>
            <input type="checkbox" id="togglePlanetsShadowCheckbox" />
          </label>
          <label class="config-row">
            <span>show orbits</span>
            <input type="checkbox" id="toggleOrbitsCheckbox" checked />
          </label>
          <label class="config-row">
            <span>show comets</span>
            <input type="checkbox" id="toggleCometsCheckbox" checked />
          </label>
          <label class="config-row">
            <span>show labels</span>
            <input type="checkbox" id="toggleLabelsCheckbox" checked />
          </label>
          <label class="config-row">
            <span>show trails</span>
            <input type="checkbox" id="toggleTrailsCheckbox" checked />
          </label>
          <label class="config-row">
            <span>real inclinations</span>
            <input type="checkbox" id="toggleInclinationsCheckbox" />
          </label>
          <label class="config-row">
            <span>dance mode</span>
            <input type="checkbox" id="toggleDanceModeCheckbox" />
          </label>
          <label class="config-row">
            <span>debug panel</span>
            <input type="checkbox" id="toggleDebugCheckbox" />
          </label>
          <label class="config-row config-row--stacked">
            <span>time speed <output id="timeSpeedOutput">1.0x</output></span>
            <input type="range" id="timeSpeedSlider" min="0" max="5" step="0.1" value="1" />
          </label>
          <label class="config-row config-row--stacked">
            <span>stars count <output id="starsCountOutput">2000</output></span>
            <input type="range" id="starsCountSlider" min="0" max="5000" step="100" value="2000" />
          </label>
          <label class="config-row config-row--stacked">
            <span>quality</span>
            <select id="qualitySelect">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <button type="button" class="reset-btn" id="resetDefaultsBtn">Reset to defaults</button>
        </div>
      </details>

      <section class="sidebar__minimap" aria-labelledby="minimap-heading">
        <h2 class="sidebar__section-title" id="minimap-heading">Minimap</h2>
        <canvas class="minimap" id="minimap" aria-label="Solar system top-down minimap"></canvas>
      </section>

      <footer class="sidebar__footer">
        <a
          class="github-link"
          href="https://github.com/Wojtazzzz/solar_system_3d"
          target="_blank"
          rel="noopener noreferrer"
        >View on GitHub ↗</a>
      </footer>
    </aside>

    <main id="app" class="scene">
      <div class="zoom-label">
        <span class="scroll-text">Scroll to zoom</span>
        <span class="slide-text">Slide to zoom</span>
        <span class="click-text">Click planet for info</span>
        <span class="tap-text">Tap planet for info</span>
        <button class="quiz-toggle" id="quizToggle" type="button">Start quiz</button>
        <button class="quiz-toggle tour-toggle" id="tourToggle" type="button">Start tour</button>
      </div>

      <aside class="info-panel" id="infoPanel" aria-hidden="true">
        <button class="info-panel__close" id="infoPanelClose" aria-label="Close">×</button>
        <h2 class="info-panel__title" id="infoPanelTitle"></h2>
        <dl class="info-panel__data" id="infoPanelData"></dl>
        <p class="info-panel__fact" id="infoPanelFact"></p>
        <div class="info-panel__tour" id="infoPanelTour" hidden>
          <span class="tour-position" id="tourPosition"></span>
          <button type="button" class="tour-nav" id="tourPrev" aria-label="Previous">← Prev</button>
          <button type="button" class="tour-nav" id="tourNext" aria-label="Next">Next →</button>
          <button type="button" class="tour-nav tour-nav--stop" id="tourStop">End tour</button>
        </div>
      </aside>

      <div class="quiz-banner" id="quizBanner" aria-hidden="true"></div>

      <div class="slider-container">
        <input
          aria-label="Zoom in or out from the Sun"
          class="slider"
          id="zoomSlider"
          type="range"
          step="0.01"
          value="1"
        />
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
