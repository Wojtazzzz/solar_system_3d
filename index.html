<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Interactive 3D solar system orrery. Drag planets to throw them, take a guided tour, play a quiz, and explore planetary facts. Built with Three.js. Installable as a PWA."
    />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Solar System 3D — interactive planetary exploration</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-system">
        <div class="loader-orbit loader-orbit--outer">
          <div class="loader-planet loader-planet--outer"></div>
        </div>
        <div class="loader-orbit loader-orbit--inner">
          <div class="loader-planet loader-planet--inner"></div>
        </div>
        <div class="loader-sun"></div>
      </div>
      <p class="loader-text">
        <span data-i18n="loading">Loading solar system</span> <span class="loader-percent" id="loaderPercent">0%</span>
      </p>
    </div>

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      data-i18n-aria="toggleMenu"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span class="sidebar-toggle__icon" aria-hidden="true"></span>
    </button>

    <div class="top-toolbar">
      <select
        class="lang-select"
        id="languageSelect"
        data-i18n-aria="language"
        aria-label="Language"
      >
        <option value="en">EN</option>
        <option value="pl">PL</option>
        <option value="de">DE</option>
      </select>

      <button
        class="sound-toggle"
        id="soundToggle"
        type="button"
        data-i18n-aria="toggleSound"
        aria-label="Toggle sound"
        aria-pressed="false"
      >
        <svg class="sound-icon sound-icon--on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
          <path d="M16 8.5a3.5 3.5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.5 6a7 7 0 010 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="sound-icon sound-icon--off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
          <line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation and settings">
      <header class="sidebar__header">
        <h1 class="sidebar__title" data-i18n="title">Solar System 3D</h1>
        <p class="sidebar__description" data-i18n="description">
          Interactive 3D orrery. Drag planets to throw them, take a guided tour,
          try the quiz, or explore real planetary facts. Built with Three.js.
        </p>
      </header>

      <details class="config-panel">
        <summary data-i18n="settings">Settings</summary>
        <div class="config-controls">
          <label class="config-row">
            <span data-i18n="planetsShadow">planets shadow</span>
            <input type="checkbox" id="togglePlanetsShadowCheckbox" />
          </label>
          <label class="config-row">
            <span data-i18n="showOrbits">show orbits</span>
            <input type="checkbox" id="toggleOrbitsCheckbox" checked />
          </label>
          <label class="config-row">
            <span data-i18n="showComets">show comets</span>
            <input type="checkbox" id="toggleCometsCheckbox" checked />
          </label>
          <label class="config-row">
            <span data-i18n="showLabels">show labels</span>
            <input type="checkbox" id="toggleLabelsCheckbox" checked />
          </label>
          <label class="config-row">
            <span data-i18n="showTrails">show trails</span>
            <input type="checkbox" id="toggleTrailsCheckbox" checked />
          </label>
          <label class="config-row">
            <span data-i18n="realInclinations">real inclinations</span>
            <input type="checkbox" id="toggleInclinationsCheckbox" />
          </label>
          <label class="config-row">
            <span data-i18n="danceMode">dance mode</span>
            <input type="checkbox" id="toggleDanceModeCheckbox" />
          </label>
          <label class="config-row">
            <span data-i18n="debugPanel">debug panel</span>
            <input type="checkbox" id="toggleDebugCheckbox" />
          </label>
          <label class="config-row config-row--stacked">
            <span><span data-i18n="timeSpeed">time speed</span> <output id="timeSpeedOutput">1.0x</output></span>
            <input type="range" id="timeSpeedSlider" min="-5" max="5" step="0.1" value="1" />
          </label>
          <label class="config-row config-row--stacked">
            <span><span data-i18n="starsCount">stars count</span> <output id="starsCountOutput">2000</output></span>
            <input type="range" id="starsCountSlider" min="0" max="5000" step="100" value="2000" />
          </label>
          <label class="config-row config-row--stacked">
            <span><span data-i18n="realisticScale">realistic scale</span> <output id="realismOutput">0%</output></span>
            <input type="range" id="realismSlider" min="0" max="1" step="0.01" value="0" />
          </label>
          <label class="config-row config-row--stacked">
            <span data-i18n="quality">quality</span>
            <select id="qualitySelect">
              <option value="low" data-i18n-option="qualityLow">Low</option>
              <option value="medium" data-i18n-option="qualityMedium" selected>Medium</option>
              <option value="high" data-i18n-option="qualityHigh">High</option>
            </select>
          </label>
          <button type="button" class="reset-btn" id="resetDefaultsBtn" data-i18n="resetToDefaults">Reset to defaults</button>
        </div>
      </details>

      <details class="config-panel">
        <summary data-i18n="objects">Objects</summary>
        <div class="object-list" id="objectList"></div>
      </details>

      <section class="sidebar__minimap" aria-labelledby="minimap-heading">
        <h2 class="sidebar__section-title" id="minimap-heading" data-i18n="minimap">Minimap</h2>
        <canvas class="minimap" id="minimap" data-i18n-aria="minimapAria" aria-label="Solar system top-down minimap"></canvas>
      </section>

      <footer class="sidebar__footer">
        <button class="save-view-btn" id="saveViewBtn" type="button" data-i18n="takeScreenshot">
          Take screenshot
        </button>
        <a
          class="github-link"
          href="https://github.com/Wojtazzzz/solar_system_3d"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="viewOnGithub"
        >View on GitHub ↗</a>
      </footer>
    </aside>

    <main id="app" class="scene">
      <div class="zoom-label">
        <span class="scroll-text" data-i18n="scrollToZoom">Scroll to zoom</span>
        <span class="slide-text" data-i18n="slideToZoom">Slide to zoom</span>
        <span class="click-text" data-i18n="clickPlanetForInfo">Click planet for info</span>
        <span class="tap-text" data-i18n="tapPlanetForInfo">Tap planet for info</span>
        <button class="quiz-toggle" id="quizToggle" type="button">Start quiz</button>
        <button class="quiz-toggle tour-toggle" id="tourToggle" type="button">Start tour</button>
      </div>

      <aside class="info-panel" id="infoPanel" aria-hidden="true">
        <button class="info-panel__close" id="infoPanelClose" data-i18n-aria="close" aria-label="Close">×</button>
        <h2 class="info-panel__title" id="infoPanelTitle"></h2>
        <div class="info-panel__compare">
          <label class="info-panel__compare-label" for="compareSelect" data-i18n="compareTo">Compare to</label>
          <select class="info-panel__compare-select" id="compareSelect" data-i18n-aria="compareAria" aria-label="Compare to another body">
            <option value="" data-i18n-option="none">None</option>
          </select>
        </div>
        <dl class="info-panel__data" id="infoPanelData"></dl>
        <div class="info-panel__fact" id="infoPanelFact"></div>
        <div class="info-panel__tour" id="infoPanelTour" hidden>
          <span class="tour-position" id="tourPosition"></span>
          <button type="button" class="tour-nav" id="tourPrev" data-i18n="prev" data-i18n-aria="prev" aria-label="Previous">← Prev</button>
          <button type="button" class="tour-nav" id="tourNext" data-i18n="next" data-i18n-aria="next" aria-label="Next">Next →</button>
          <button type="button" class="tour-nav tour-nav--stop" id="tourStop" data-i18n="endTour">End tour</button>
        </div>
      </aside>

      <div class="quiz-banner" id="quizBanner" aria-hidden="true"></div>

      <div class="compare-panel" id="comparePanel" aria-hidden="true" role="dialog" aria-labelledby="comparePanelTitle">
        <div class="compare-panel__backdrop"></div>
        <div class="compare-panel__content">
          <header class="compare-panel__header">
            <h2 class="compare-panel__title" id="comparePanelTitle"></h2>
            <button class="compare-panel__close" id="comparePanelClose" data-i18n-aria="close" aria-label="Close">×</button>
          </header>
          <div class="compare-panel__toolbar">
            <label class="compare-panel__toggle">
              <input type="checkbox" id="comparePanelRealisticToggle" />
              <span data-i18n="realisticSizes">Realistic sizes</span>
            </label>
          </div>
          <div class="compare-panel__stage">
            <canvas class="compare-panel__canvas" id="comparePanelCanvas"></canvas>
            <div class="compare-panel__names">
              <span id="comparePanelNameA"></span>
              <span id="comparePanelNameB"></span>
            </div>
          </div>
          <dl class="compare-panel__data" id="comparePanelData"></dl>
          <div class="compare-panel__facts">
            <div class="compare-panel__fact">
              <span class="compare-panel__fact-name" id="comparePanelFactNameA"></span>
              <span id="comparePanelFactA"></span>
            </div>
            <div class="compare-panel__fact">
              <span class="compare-panel__fact-name" id="comparePanelFactNameB"></span>
              <span id="comparePanelFactB"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="slider-container">
        <input
          data-i18n-aria="zoomAria"
          aria-label="Zoom in or out from the Sun"
          class="slider"
          id="zoomSlider"
          type="range"
          step="0.01"
          value="1"
        />
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
